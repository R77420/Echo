[pytest]
# La suite standard est rapide, déterministe et hors ligne : les tests qui
# appellent réellement l'API Groq (réseau + quota) portent le marqueur « groq »
# et sont exclus par défaut.
#   pytest tests/            → suite standard (sans Groq)
#   pytest tests/ -m groq    → validation des prompts (correction.py / prompts)
addopts = -m "not groq"
testpaths = tests
markers =
    groq: appel réel à l'API Groq (réseau + quota) — exclu par défaut, un retry sur 429
